[project]
name = "ubl-bindings"
version = "0.2.0"
description = "Python data bindings for all UBL document types, generated from the official XSD schemas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ALYF GmbH" }]
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "xsdata>=26.10",
]
keywords = ["ubl", "xml", "e-invoicing", "peppol", "xsd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Markup :: XML",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/alyf-de/ubl-bindings"
Changelog = "https://github.com/alyf-de/ubl-bindings/blob/main/CHANGELOG.md"
Issues = "https://github.com/alyf-de/ubl-bindings/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Pin the generator, so that the generated code changes only on purpose.
    "xsdata[cli]==26.10",
    "ruff==0.17.3",
]

[tool.ruff]
line-length = 120
# xsdata formats the generated code with its own ruff configuration.
extend-exclude = ["src/ubl_bindings/v*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "RUF"]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"
