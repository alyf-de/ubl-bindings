[project]
name = "ubl-bindings"
version = "0.1.0"
description = "Python data bindings for all UBL document types, generated from the official XSD schemas"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "ALYF GmbH" }]
requires-python = ">=3.10"
dependencies = [
    "lxml>=5.0",
    "xsdata>=26.10",
]
keywords = ["ubl", "xml", "e-invoicing", "peppol", "xsd"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Text Processing :: Markup :: XML",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Pin the generator, so that the generated code changes only on purpose.
    "xsdata[cli]==26.10",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"
